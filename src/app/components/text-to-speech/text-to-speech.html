<div class="container mt-5">
  <div class="card p-4">
    <h2>Texto a Voz</h2>

    <textarea
      class="form-control mt-3"
      rows="5"
      [(ngModel)]="textoAConvertir"
      placeholder="Escriba algo..."
    ></textarea>

    <button class="btn btn-primary mt-3" (click)="generarAudio()">Convertir a Audio</button>

    <hr />

    <audio controls autoplay class="w-100 mt-3" [src]="audioUrl"></audio>
  </div>
</div>
